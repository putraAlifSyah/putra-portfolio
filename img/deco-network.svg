<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#101010" stroke-width="0.8" opacity="0.04">
  <!-- Network nodes -->
  <circle cx="100" cy="100" r="8"/>
  <circle cx="40" cy="40" r="5"/>
  <circle cx="160" cy="40" r="5"/>
  <circle cx="40" cy="160" r="5"/>
  <circle cx="160" cy="160" r="5"/>
  <circle cx="100" cy="30" r="4"/>
  <circle cx="30" cy="100" r="4"/>
  <circle cx="170" cy="100" r="4"/>
  <circle cx="100" cy="170" r="4"/>
  <!-- Connections -->
  <line x1="100" y1="100" x2="40" y2="40"/>
  <line x1="100" y1="100" x2="160" y2="40"/>
  <line x1="100" y1="100" x2="40" y2="160"/>
  <line x1="100" y1="100" x2="160" y2="160"/>
  <line x1="100" y1="100" x2="100" y2="30"/>
  <line x1="100" y1="100" x2="30" y2="100"/>
  <line x1="100" y1="100" x2="170" y2="100"/>
  <line x1="100" y1="100" x2="100" y2="170"/>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="80" stroke-dasharray="4 6"/>
</svg>
