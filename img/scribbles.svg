<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none" stroke="#101010" stroke-linecap="round">
  <!-- Cross-hatching / arsiran -->
  <!-- Diagonal lines going right -->
  <line x1="50" y1="100" x2="200" y2="250" stroke-width="0.8" opacity="0.07"/>
  <line x1="80" y1="80" x2="230" y2="230" stroke-width="0.8" opacity="0.06"/>
  <line x1="110" y1="60" x2="260" y2="210" stroke-width="0.8" opacity="0.07"/>
  <line x1="140" y1="40" x2="290" y2="190" stroke-width="0.8" opacity="0.05"/>
  <line x1="170" y1="20" x2="320" y2="170" stroke-width="0.8" opacity="0.06"/>
  
  <!-- Diagonal lines going left (cross) -->
  <line x1="200" y1="100" x2="50" y2="250" stroke-width="0.8" opacity="0.05"/>
  <line x1="230" y1="80" x2="80" y2="230" stroke-width="0.8" opacity="0.06"/>
  <line x1="260" y1="60" x2="110" y2="210" stroke-width="0.8" opacity="0.05"/>
  
  <!-- Cluster 2 - middle area -->
  <line x1="300" y1="300" x2="480" y2="480" stroke-width="0.8" opacity="0.07"/>
  <line x1="320" y1="280" x2="500" y2="460" stroke-width="0.8" opacity="0.06"/>
  <line x1="340" y1="260" x2="520" y2="440" stroke-width="0.8" opacity="0.07"/>
  <line x1="360" y1="240" x2="540" y2="420" stroke-width="0.8" opacity="0.05"/>
  <line x1="380" y1="220" x2="560" y2="400" stroke-width="0.8" opacity="0.06"/>
  
  <line x1="480" y1="300" x2="300" y2="480" stroke-width="0.8" opacity="0.05"/>
  <line x1="500" y1="280" x2="320" y2="460" stroke-width="0.8" opacity="0.06"/>
  <line x1="520" y1="260" x2="340" y2="440" stroke-width="0.8" opacity="0.05"/>
  <line x1="540" y1="240" x2="360" y2="420" stroke-width="0.8" opacity="0.06"/>
  
  <!-- Cluster 3 - bottom left -->
  <line x1="30" y1="550" x2="180" y2="700" stroke-width="0.8" opacity="0.06"/>
  <line x1="50" y1="530" x2="200" y2="680" stroke-width="0.8" opacity="0.07"/>
  <line x1="70" y1="510" x2="220" y2="660" stroke-width="0.8" opacity="0.06"/>
  <line x1="90" y1="490" x2="240" y2="640" stroke-width="0.8" opacity="0.05"/>
  
  <line x1="180" y1="550" x2="30" y2="700" stroke-width="0.8" opacity="0.05"/>
  <line x1="200" y1="530" x2="50" y2="680" stroke-width="0.8" opacity="0.06"/>
  <line x1="220" y1="510" x2="70" y2="660" stroke-width="0.8" opacity="0.05"/>
  
  <!-- Cluster 4 - top right -->
  <line x1="400" y1="50" x2="550" y2="200" stroke-width="0.8" opacity="0.06"/>
  <line x1="420" y1="30" x2="570" y2="180" stroke-width="0.8" opacity="0.07"/>
  <line x1="440" y1="10" x2="590" y2="160" stroke-width="0.8" opacity="0.06"/>
  
  <line x1="550" y1="50" x2="400" y2="200" stroke-width="0.8" opacity="0.05"/>
  <line x1="570" y1="30" x2="420" y2="180" stroke-width="0.8" opacity="0.06"/>
  
  <!-- Cluster 5 - bottom right -->
  <line x1="380" y1="600" x2="560" y2="780" stroke-width="0.8" opacity="0.07"/>
  <line x1="400" y1="580" x2="580" y2="760" stroke-width="0.8" opacity="0.06"/>
  <line x1="420" y1="560" x2="600" y2="740" stroke-width="0.8" opacity="0.05"/>
  
  <line x1="560" y1="600" x2="380" y2="780" stroke-width="0.8" opacity="0.05"/>
  <line x1="580" y1="580" x2="400" y2="760" stroke-width="0.8" opacity="0.06"/>
  <line x1="600" y1="560" x2="420" y2="740" stroke-width="0.8" opacity="0.05"/>
  
  <!-- Scattered single hatches -->
  <line x1="250" y1="150" x2="280" y2="180" stroke-width="0.8" opacity="0.05"/>
  <line x1="150" y1="400" x2="180" y2="430" stroke-width="0.8" opacity="0.06"/>
  <line x1="500" y1="520" x2="530" y2="550" stroke-width="0.8" opacity="0.05"/>
  <line x1="280" y1="700" x2="310" y2="730" stroke-width="0.8" opacity="0.06"/>
</svg>
