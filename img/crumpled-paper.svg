<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="none">
  <defs>
    <filter id="paper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" seed="2" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="white" surfaceScale="1.5" result="light">
        <feDistantLight azimuth="135" elevation="60"/>
      </feDiffuseLighting>
      <feComposite in="light" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="#ffffff"/>
  <rect width="800" height="800" fill="#ffffff" filter="url(#paper)" opacity="0.3"/>
  <!-- Crease lines -->
  <path d="M0 200 Q200 180 400 210 Q600 240 800 190" fill="none" stroke="rgba(0,0,0,0.03)" stroke-width="1.5"/>
  <path d="M0 400 Q150 380 350 420 Q550 460 800 390" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="1"/>
  <path d="M0 600 Q250 580 500 620 Q700 640 800 590" fill="none" stroke="rgba(0,0,0,0.03)" stroke-width="1.5"/>
  <path d="M200 0 Q180 200 220 400 Q260 600 200 800" fill="none" stroke="rgba(0,0,0,0.03)" stroke-width="1"/>
  <path d="M500 0 Q480 150 520 350 Q540 550 500 800" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="1"/>
  <path d="M700 0 Q720 250 680 500 Q660 700 710 800" fill="none" stroke="rgba(0,0,0,0.03)" stroke-width="1"/>
  <!-- Diagonal creases -->
  <path d="M0 0 Q200 150 400 300 Q600 500 800 700" fill="none" stroke="rgba(0,0,0,0.025)" stroke-width="1.5"/>
  <path d="M800 0 Q600 200 400 400 Q200 600 0 800" fill="none" stroke="rgba(0,0,0,0.025)" stroke-width="1"/>
  <path d="M100 0 Q300 300 500 500 Q700 700 800 800" fill="none" stroke="rgba(0,0,0,0.02)" stroke-width="1"/>
  <!-- Shadow patches for crumple depth -->
  <ellipse cx="150" cy="250" rx="80" ry="50" fill="rgba(0,0,0,0.015)" transform="rotate(-20 150 250)"/>
  <ellipse cx="600" cy="180" rx="100" ry="40" fill="rgba(0,0,0,0.02)" transform="rotate(15 600 180)"/>
  <ellipse cx="350" cy="500" rx="90" ry="60" fill="rgba(0,0,0,0.015)" transform="rotate(-10 350 500)"/>
  <ellipse cx="650" cy="600" rx="70" ry="50" fill="rgba(0,0,0,0.02)" transform="rotate(25 650 600)"/>
  <ellipse cx="200" cy="700" rx="100" ry="40" fill="rgba(0,0,0,0.015)" transform="rotate(-5 200 700)"/>
  <ellipse cx="500" cy="300" rx="60" ry="80" fill="rgba(0,0,0,0.015)" transform="rotate(10 500 300)"/>
</svg>
